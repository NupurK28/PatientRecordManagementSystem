<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Patient History - NBA Health Centre</title>
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/getPatientHistory.css" />
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-logo">
            <img src="img/web_logo.png" alt="Logo" />
        </div>
        <div class="sidebar-menu">
            <h2>NBA HEALTH CENTRE</h2>
            <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
            <div class="dropdown">
                <a href="#" class="dropdown-toggle"><i class="fas fa-user-injured"></i> Patients ▾</a>
                <div class="dropdown-content">
                    <a href="addPatient.html"><i class="fas fa-plus-circle"></i> Add Record</a>
                    <a href="viewRecord.html"><i class="fas fa-eye"></i> View Record</a>
                </div>
            </div>
            <div class="dropdown">
                <a href="#" class="dropdown-toggle"><i class="fas fa-user-doctor"></i> Doctors ▾</a>
                <div class="dropdown-content">
                    <a href="adddoctor.html"><i class="fas fa-plus-circle"></i> Add Record</a>
                    <a href="doctorviewrecord.html"><i class="fas fa-eye"></i> View Record</a>
                </div>
            </div>
            <div class="dropdown">
                <a href="#" class="dropdown-toggle"><i class="fas fa-user-doctor"></i> Patient History ▾</a>
                <div class="dropdown-content">
                    <a href="addPatientHistory.html"><i class="fas fa-book"></i> Add Patient History</a>
                    <a href="patientHistory.html"><i class="fas fa-book"></i> View Patient History</a>
                </div>
            </div>

            <div class="sidebar-bottom">
                <a href="Settings.php"><i class="fas fa-cog"></i> Settings</a>
                <a href="backend/logout.php"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="form-section">
            <h2>View Patient History</h2>
            <input type="text" id="caseNoInput" placeholder="Enter Case Number" />
            <button id="searchBtn">Search</button>
        </div>

        <div class="history-section">
            <h2>Visit History</h2>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Reason for Visit</th>
                        <th>Medicine Prescribed</th>
                        <th>Doctor</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <!-- History rows will appear here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Dropdown toggle handler
        document.querySelectorAll('.dropdown-toggle').forEach(el => {
            el.addEventListener('click', event => {
                event.preventDefault();
                const parent = event.target.closest('.dropdown');
                parent.classList.toggle('active');
            });
        });

        // Fetch and display patient history
        function fetchPatientHistory() {
            const caseNo = document.getElementById("caseNoInput").value.trim();
            if (!caseNo) {
                alert("Please enter a Case Number.");
                return;
            }

            fetch(`backend/getPatientHistory.php?case_no=${encodeURIComponent(caseNo)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        alert("Error: " + data.error);
                        return;
                    }
                    if (data.message) {
                        alert(data.message);
                        return;
                    }

                    const tbody = document.getElementById('historyBody');
                    tbody.innerHTML = ''; // clear old results

                    if (data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No records found for Case No: ${caseNo}</td></tr>`;
                        return;
                    }

                    data.forEach(record => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${record.visit_date || ''}</td>
                            <td>${record.reason || ''}</td>
                            <td>${record.medicine || ''}</td>
                            <td>${record.doctor || ''}</td>
                            <td>${record.notes || ''}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    console.error("Fetch failed:", err);
                    alert("Something went wrong while fetching history.");
                });
        }

        document.getElementById('searchBtn').addEventListener('click', fetchPatientHistory);
    </script>
</body>

</html>
